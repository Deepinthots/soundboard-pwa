<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🔊 Office Soundboard</title>
  <meta name="description" content="Office soundboard with searchable sound clips.">
  <meta name="theme-color" content="#2a1b3d">
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {--pink:#ffb3d9;--purple:#d9b3ff;--blue:#b3d9ff;--cyan:#b3ffff;--green:#b3ffb3;--yellow:#ffffb3;--orange:#ffdb7d;--coral:#ffb3b3;--bg:#2a1b3d;--panel:#44475a;--dark:#282a36;--text:#f8f8f2}
    * {box-sizing:border-box}
    body {margin:0;min-height:100vh;padding:16px;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.02) 2px,rgba(255,255,255,.02) 4px),var(--bg);color:var(--text);font-family:'Press Start 2P','Courier New',monospace;line-height:1.8;display:flex;flex-direction:column}
    main {flex:1}
    .header {text-align:center;padding:24px 16px;margin-bottom:24px;background:var(--panel);border:4px solid var(--pink);box-shadow:4px 4px 0 #cc7da6,8px 8px 0 #a67dcc}
    h1 {font-size:clamp(1rem,3vw,1.8rem);color:var(--cyan);text-shadow:2px 2px #7dcccc,4px 4px var(--bg);line-height:1.7;margin:0 0 8px}
    .subtitle {font-size:.75rem;color:var(--yellow);margin:0;line-height:2}
    .controls {background:var(--panel);border:4px solid var(--green);padding:20px;margin-bottom:24px;box-shadow:4px 4px 0 #7dcc7d,8px 8px 0 var(--bg)}
    .search-input {display:block;width:100%;padding:14px 18px;background:var(--dark);border:3px solid var(--blue);color:var(--text);font:inherit;font-size:.8rem;line-height:1.8;outline:none}
    .search-input:focus {border-color:var(--cyan);box-shadow:0 0 0 2px var(--yellow)}
    .tip {text-align:center;color:var(--orange);font-size:.6rem;margin-top:16px;line-height:2}
    .sounds-container {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px;margin-top:20px}
    .sound-button {padding:18px;border:3px solid var(--coral);background:var(--panel);color:var(--text);cursor:pointer;text-align:left;font-family:inherit;line-height:1.8;position:relative;box-shadow:3px 3px 0 #cc7d7d,6px 6px 0 var(--bg);min-height:94px}
    .sound-button::before {content:'♪';position:absolute;top:6px;right:8px;color:var(--green)}
    .sound-button:hover {background:var(--coral);color:var(--bg);border-color:var(--yellow);transform:translate(-2px,-2px)}
    .sound-button:focus-visible {outline:3px solid var(--yellow);outline-offset:3px}
    .sound-button:active {transform:translate(2px,2px)}
    .sound-name {color:var(--cyan);font-size:.75rem;margin-bottom:10px;overflow-wrap:anywhere}
    .sound-artist {color:var(--purple);font-size:.6rem}
    .sound-button:hover .sound-name,.sound-button:hover .sound-artist {color:var(--bg)}
    .loading {padding:36px;text-align:center;color:var(--purple);font-size:.8rem;grid-column:1/-1}
    .status {position:fixed;top:16px;right:16px;max-width:min(500px,calc(100vw - 32px));padding:16px;background:var(--panel);border:3px solid var(--coral);font-size:.6rem;line-height:1.8;z-index:10;opacity:0;pointer-events:none;overflow-wrap:anywhere}
    .status.show {opacity:1}
    .status.success {border-color:var(--green)}
    .offline-indicator {display:none;position:fixed;bottom:16px;left:16px;background:var(--panel);padding:14px;border:3px solid var(--orange);font-size:.6rem;line-height:1.8}
    .offline-indicator.show {display:block}
    .footer {text-align:center;padding:24px;margin-top:40px;background:var(--panel);border:4px solid var(--purple);box-shadow:4px 4px 0 #a67dcc,8px 8px 0 var(--bg)}
    .footer-content {font-size:.6rem;color:var(--purple);line-height:2}
    .footer-links {display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:18px}
    .footer-link {font-size:.6rem;color:var(--cyan);text-decoration:none;border:2px solid var(--cyan);padding:8px}
    .footer-link:hover {background:var(--cyan);color:var(--bg)}
    @media(max-width:500px){body{padding:12px}.controls{padding:12px}.search-input{font-size:.65rem}.tip{font-size:.5rem}.sound-name{font-size:.65rem}}
  </style>
</head>
<body>
  <main>
    <header class="header"><h1>♫ OFFICE SOUNDBOARD ♫</h1><p class="subtitle">OFFICE SOUNDS • <span id="sound-count">0</span> AUDIO DROPS</p></header>
    <section class="controls" aria-label="Soundboard controls"><input type="search" id="search-input" class="search-input" placeholder="SEARCH FOR SOUNDS..." aria-label="Search sounds" autocomplete="off"><p class="tip">↑ PRESS [S] TO SEARCH • CLICK TO PLAY ↑</p></section>
    <section id="sounds-container" class="sounds-container" aria-label="Sound clips"><div class="loading">LOADING SOUNDS...</div></section>
  </main>
  <footer class="footer"><div class="footer-content">POWERED BY PWA SOUNDBOARD • OPEN SOURCE &amp; FREE TO USE</div><nav class="footer-links" aria-label="Links"><a class="footer-link" href="https://github.com/Deepinthots/soundboard-pwa" target="_blank" rel="noopener">📂 SOURCE CODE</a><a class="footer-link" href="https://github.com/Deepinthots/soundboard-pwa#readme" target="_blank" rel="noopener">📖 DOCUMENTATION</a></nav></footer>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="offline-indicator" class="offline-indicator">OFFLINE — SOUNDS REQUIRE CONNECTION</div>
  <script src="./main.js?v=20261022-fix1" defer></script>
</body>
</html>
