
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111715">
  <meta name="description" content="The Archives">
  <title>The Archives</title>

  <link rel="icon" href="./public/favicon.svg">

  <style>
    :root {
      --bg: #111715;
      --panel: #1b2521;
      --panel-hover: #26372f;
      --accent: #2d6a5b;
      --accent-light: #69ab92;
      --text: #f0f3f1;
      --muted: #99aaa3;
      --border: #304037;
      --danger: #e88c8c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1150px;
      margin: 0 auto;
      padding: 48px 24px;
      min-height: calc(100vh - 100px);
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 650;
      letter-spacing: -0.8px;
      margin: 0;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .controls {
      margin-bottom: 26px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s,
                  box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(105,171,146,.12);
    }

    .tip {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .sounds-container {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(min(235px, 100%), 1fr)
      );
      gap: 12px;
    }

    .sound-button {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      min-height: 100px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s,
                  border-color 0.15s,
                  transform 0.15s;
    }

    .sound-button:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .sound-button:active {
      background: var(--accent);
      transform: translateY(0);
    }

    .sound-button:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 3px;
    }

    .sound-button::after {
      content: "▶";
      position: absolute;
      bottom: 17px;
      right: 18px;
      color: var(--accent-light);
      font-size: 13px;
    }

    .sound-button:active::after {
      color: white;
    }

    .sound-name {
      font-size: 0.95rem;
      font-weight: 550;
      line-height: 1.4;
      overflow-wrap: anywhere;
      padding-right: 10px;
    }

    .sound-artist {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .loading {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      max-width: min(400px, calc(100vw - 40px));
      background: var(--panel);
      border: 1px solid var(--danger);
      border-radius: 10px;
      padding: 16px 20px;
      color: var(--text);
      box-shadow: 0 8px 28px rgba(0,0,0,.3);
      opacity: 0;
      pointer-events: none;
      overflow-wrap: anywhere;
    }

    .status.show {
      opacity: 1;
    }

    .status.success {
      border-color: var(--accent-light);
    }

    .offline-indicator {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 12px 18px;
      background: var(--panel);
      border: 1px solid var(--danger);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.8rem;
      z-index: 100;
    }

    .offline-indicator.show {
      display: block;
    }

    .footer {
      max-width: 1150px;
      margin: 0 auto;
      padding: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-content {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-link {
      color: var(--accent-light);
      font-size: 0.8rem;
      text-decoration: none;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      main {
        padding: 28px 16px;
      }

      .header {
        margin-bottom: 24px;
      }

      .sounds-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .sound-button {
        padding: 14px;
        min-height: 105px;
      }

      .sound-name {
        font-size: 0.84rem;
      }

      .footer {
        padding: 20px 16px;
      }
    }

    @media (max-width: 360px) {
      .sounds-container {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sound-button,
      .search-input {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="header">
      <h1>The Archives</h1>
      <p class="subtitle">
        <span id="sound-count">0</span> sounds available
      </p>
    </header>

    <section class="controls"
             aria-label="Soundboard controls">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search sounds..."
        aria-label="Search sounds"
        autocomplete="off"
      >
      <p class="tip">
        Press S to search · Click any sound to play
      </p>
    </section>

    <section
      id="sounds-container"
      class="sounds-container"
      aria-label="Sound clips"
    >
      <div class="loading">Loading sounds...</div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      The Archives
    </div>
    <nav class="footer-links" aria-label="Links">
      <a
        class="footer-link"
        href="https://github.com/Deepinthots/soundboard-pwa"
        target="_blank"
        rel="noopener noreferrer"
      >GitHub</a>
    </nav>
  </footer>

  <div
    id="status"
    class="status"
    role="status"
    aria-live="polite"
  ></div>

  <div
    id="offline-indicator"
    class="offline-indicator"
  >
    Offline — sounds require a connection
  </div>

  <script src="./main.js?v=20261022-fix1" defer></script>
</body>
</html>
