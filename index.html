<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>🔊 Office Soundboard</title>
		
		<!-- PWA Manifest & Meta Tags -->
		<link rel="manifest" href="./manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Office Sounds" />
		<meta name="theme-color" content="#1a1a1a" />

		<!-- Icons & Favicons -->
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="apple-touch-icon" href="./icons/icon-192.png" />

		<!-- Stylesheet -->
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div id="app">
			<!-- Header Section -->
			<header class="header">
				<h1>♫ OFFICE SOUNDBOARD ♫</h1>
				<div class="subtitle">OFFICE SOUNDS • <span id="sound-count">38</span> AUDIO DROPS</div>
			</header>

			<!-- Search & Tips -->
			<div class="search-container">
				<input type="text" id="search-input" placeholder="SEARCH FOR SOUNDS..." autocomplete="off" />
				<div class="tip">↑ PRESS [S] TO SEARCH • CLICK TO PLAY ↑</div>
			</div>

			<!-- Offline Indicator Banner -->
			<div id="offline-indicator" class="offline-banner">
				OFFLINE MODE - USING CACHED SOUNDS
			</div>

			<!-- Main Sounds Grid Container -->
			<main id="sounds-container" class="sounds-grid">
				<!-- Sound buttons render here dynamically -->
			</main>

			<!-- Status Toast / Notification -->
			<div id="status" class="status"></div>
		</div>

		<!-- Main Application Module Script -->
		<script type="module" src="./main.js"></script>
	</body>
</html>
