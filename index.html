
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a09">
<meta name="description" content="The Archives soundboard">
<title>The Archives</title>
<link rel="icon" href="./public/favicon.svg">

<style>
:root {
  --bg: #080a09;
  --panel: #111413;
  --hover: #19251f;
  --active: #1b3026;
  --accent: #2d6a5b;
  --accent-light: #5e9c87;
  --text: #f3f5f4;
  --muted: #8f9a95;
  --border: #232927;
  --danger: #d48686;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 1600px;
  margin: auto;
  padding: 28px 12px 40px;
  min-height: calc(100vh - 70px);
}

.header {
  margin-bottom: 22px;
}

h1 {
  margin: 0 0 5px;
  font-size: clamp(1.65rem, 3vw, 2.2rem);
  font-weight: 650;
  letter-spacing: -.7px;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: .85rem;
}

.controls {
  margin-bottom: 16px;
}

.search-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--text);
  font: inherit;
  font-size: .9rem;
  outline: none;
}

.search-input::placeholder {
  color: var(--muted);
}

.search-input:focus {
  border-color: var(--accent-light);
  box-shadow: 0 0 0 3px rgba(94,156,135,.12);
}

.tip {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: .75rem;
}

/* Pitch controls */

.pitch-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px 16px;
  margin: 16px 0 0;
}

.mode-row {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.mode-button {
  flex: 1;
  padding: 10px 12px;
  border-radius: 7px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: #191e1b;
  font: inherit;
  font-size: .82rem;
  cursor: pointer;
}

.mode-button.selected {
  border-color: var(--accent);
  background: #203328;
  color: var(--text);
}

.mode-button:hover {
  border-color: var(--accent-light);
}

.pitch-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.pitch-title {
  font-size: .88rem;
  font-weight: 600;
}

.pitch-title::before {
  content: "♫";
  color: var(--accent-light);
  margin-right: 9px;
}

.pitch-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pitch-value {
  font-size: .9rem;
  font-weight: 600;
  min-width: 56px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.pitch-reset,
.update-later {
  background: #1c2420;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  padding: 7px 13px;
  font: inherit;
  font-size: .8rem;
  cursor: pointer;
}

.pitch-reset:hover,
.update-later:hover {
  background: var(--hover);
  border-color: var(--accent-light);
}

.pitch-slider {
  display: block;
  width: 100%;
  margin: 0;
  accent-color: var(--accent-light);
  cursor: pointer;
}

.pitch-labels {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  color: var(--muted);
  font-size: .72rem;
}

/* Sound buttons */

.sounds-container {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(min(190px,100%),1fr));
  gap: 8px;
}

.sound-button {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 72px;
  padding: 12px 35px 12px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition:
    background .15s,
    border-color .15s,
    box-shadow .15s,
    transform .15s;
}

.sound-button:hover {
  background: var(--hover);
  border-color: #3e8065;
  box-shadow: 0 0 0 1px rgba(45,106,91,.15);
  transform: translateY(-1px);
}

.sound-button:active {
  background: var(--active);
  border-color: var(--accent-light);
  transform: translateY(0);
}

.sound-button::after {
  content: "▶";
  position: absolute;
  right: 12px;
  bottom: 12px;
  color: var(--accent-light);
  font-size: 12px;
}

.sound-button:focus-visible,
.pitch-reset:focus-visible,
.mode-button:focus-visible,
.update-now:focus-visible,
.update-later:focus-visible {
  outline: 2px solid var(--accent-light);
  outline-offset: 2px;
}

.sound-name {
  font-size: .88rem;
  font-weight: 550;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.sound-artist {
  color: var(--muted);
  font-size: .71rem;
}

.loading {
  grid-column: 1 / -1;
  padding: 40px 12px;
  color: var(--muted);
  text-align: center;
}

/* Status messages */

.status {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100;
  max-width: min(400px,calc(100vw - 32px));
  padding: 14px 16px;
  border: 1px solid var(--danger);
  border-radius: 9px;
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 8px 28px rgba(0,0,0,.35);
  opacity: 0;
  pointer-events: none;
  overflow-wrap: anywhere;
}

.status.show {
  opacity: 1;
}

.offline-indicator {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 100;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--danger);
  border-radius: 9px;
  font-size: .8rem;
}

.offline-indicator.show {
  display: block;
}

/* Footer */

.footer {
  max-width: 1600px;
  margin: auto;
  padding: 18px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.footer-content {
  color: var(--muted);
  font-size: .78rem;
}

.footer-link {
  color: var(--accent-light);
  text-decoration: none;
  font-size: .8rem;
}

.footer-link:hover {
  text-decoration: underline;
}

/* Update notification */

.update-banner {
  display: none;
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 9999;
  width: min(350px,calc(100vw - 36px));
  padding: 18px;
  border: 1px solid var(--accent);
  border-radius: 11px;
  background: var(--panel);
  box-shadow: 0 10px 35px rgba(0,0,0,.55);
}

.update-banner.show {
  display: block;
}

.update-heading {
  margin: 0 0 8px;
  font-size: .95rem;
  font-weight: 650;
}

.update-description {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: .82rem;
  line-height: 1.5;
}

.update-actions {
  display: flex;
  gap: 9px;
}

.update-now {
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 7px;
  padding: 9px 15px;
  font: inherit;
  font-size: .8rem;
  font-weight: 600;
  color: white;
  cursor: pointer;
}

.update-now:hover {
  background: #397d6a;
}

.update-now:disabled {
  opacity: .6;
  cursor: wait;
}

/* Mobile layout */

@media (max-width: 600px) {
  main {
    padding: 22px 10px 32px;
  }

  .sounds-container {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap: 8px;
  }

  .sound-button {
    min-height: 76px;
    padding: 11px 26px 11px 10px;
  }

  .sound-name {
    font-size: .82rem;
  }

  .pitch-panel {
    padding: 12px;
  }

  .pitch-labels {
    font-size: .63rem;
  }

  .footer {
    padding: 16px 10px;
  }
}

@media (max-width: 350px) {
  .sounds-container {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sound-button {
    transition: none;
  }
}
</style>

<!-- Tone.js for pitch shifting without changing speed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

</head>

<body>

<main>

  <header class="header">
    <h1>The Archives</h1>
    <p class="subtitle">
      <span id="sound-count">0</span> sounds available
    </p>
  </header>

  <section
    class="controls"
    aria-label="Soundboard controls"
  >

    <input
      id="search-input"
      class="search-input"
      type="search"
      placeholder="Search sounds..."
      aria-label="Search sounds"
      autocomplete="off"
    >

    <p class="tip">Click any sound to play</p>

    <div class="pitch-panel">

      <div
        class="mode-row"
        role="group"
        aria-label="Playback mode"
      >
        <button
          class="mode-button selected"
          data-playback-mode="pitch"
          type="button"
          aria-pressed="true"
        >
          Pitch only
        </button>

        <button
          class="mode-button"
          data-playback-mode="speed"
          type="button"
          aria-pressed="false"
        >
          Pitch + Speed
        </button>
      </div>

      <div class="pitch-header">

        <label
          class="pitch-title"
          for="pitch-slider"
        >
          Pitch
        </label>

        <div class="pitch-actions">

          <output
            id="pitch-value"
            class="pitch-value"
            for="pitch-slider"
          >0 st</output>

          <button
            id="pitch-reset"
            class="pitch-reset"
            type="button"
          >
            Reset
          </button>

        </div>

      </div>

      <input
        id="pitch-slider"
        class="pitch-slider"
        type="range"
        min="-100"
        max="100"
        step="1"
        value="0"
        aria-label="Pitch adjustment"
      >

      <div
        class="pitch-labels"
        id="pitch-labels"
      >
        <span>-12 st Deep</span>
        <span>Normal</span>
        <span>+12 st High</span>
      </div>

    </div>

  </section>

  <section
    id="sounds-container"
    class="sounds-container"
    aria-label="Sound clips"
  >
    <div class="loading">Loading sounds...</div>
  </section>

</main>

<footer class="footer">

  <div class="footer-content">
    The Archives
  </div>

  <nav aria-label="Links">
    <a
      class="footer-link"
      href="https://github.com/Deepinthots/soundboard-pwa"
      target="_blank"
      rel="noopener noreferrer"
    >
      GitHub
    </a>
  </nav>

</footer>

<div
  id="status"
  class="status"
  role="status"
  aria-live="polite"
></div>

<div
  id="offline-indicator"
  class="offline-indicator"
>
  Offline — sounds require a connection
</div>

<!-- Automatic update notification -->

<div
  id="archives-update-banner"
  class="update-banner"
  role="status"
  aria-live="polite"
>

  <h2 class="update-heading">
    Update available
  </h2>

  <p class="update-description">
    A newer version of The Archives is ready.
  </p>

  <div class="update-actions">

    <button
      id="archives-update-now"
      class="update-now"
      type="button"
    >
      Update now
    </button>

    <button
      id="archives-update-later"
      class="update-later"
      type="button"
    >
      Later
    </button>

  </div>

</div>


<!-- The Archives: Update checker and main.js loader -->
<script>
(() => {
  'use strict';

  const CHECK_INTERVAL = 10 * 60 * 1000;
  const base = new URL('./', document.baseURI);

  const API_URL =
    'https://api.github.com/repos/' +
    'Deepinthots/soundboard-pwa/' +
    'contents/public/sounds?ref=main';

  const banner = document.getElementById(
    'archives-update-banner'
  );

  const updateNow = document.getElementById(
    'archives-update-now'
  );

  const later = document.getElementById(
    'archives-update-later'
  );

  let loadedMainVersion = null;
  let initialSoundVersion = null;
  let checking = false;
  let pendingVersion = null;
  let dismissedVersion = null;

  function hash(text) {
    let value = 2166136261;

    for (let i = 0; i < text.length; i++) {
      value ^= text.charCodeAt(i);
      value = Math.imul(value, 16777619);
    }

    return (value >>> 0).toString(16);
  }

  // Normalize the HTML before comparing versions.

function htmlVersion(source) {
  const doc = new DOMParser().parseFromString(
    source,
    'text/html'
  );

  // Compare stable page content, not the
  // entire DOM that JavaScript can modify.
  const styles = [...doc.querySelectorAll('style')]
    .map(el => el.textContent)
    .join('\n');

  const scripts = [...doc.querySelectorAll(
    'script:not([src])'
  )]
    .map(el => el.textContent)
    .join('\n');

  const main = doc.querySelector('main')?.innerHTML || '';
  const footer = doc.querySelector('footer')?.innerHTML || '';

  return hash([
    doc.title,
    styles,
    scripts,
    main,
    footer
  ].join('\n---\n'));
}


  // Capture this page before main.js modifies it.
  const loadedHTMLVersion = htmlVersion(
    document.documentElement.outerHTML
  );

  async function fetchFresh(filename) {
    const url = new URL(filename, base);

    url.searchParams.set(
      '_archives_check',
      String(Date.now())
    );

    const response = await fetch(url.href, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(
        filename + ': HTTP ' + response.status
      );
    }

    return response.text();
  }

  // Get the current MP3 filenames and file revisions.
  async function getSoundVersion() {
    const response = await fetch(API_URL, {
      cache: 'no-store',
      headers: {
        Accept: 'application/vnd.github+json'
      }
    });

    if (!response.ok) {
      throw new Error(
        'Sound-list check: HTTP ' + response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error(
        'Unexpected GitHub sound-list response'
      );
    }

    const files = data
      .filter(item =>
        item.type === 'file' &&
        /\.mp3$/i.test(item.name)
      )
      .map(item => `${item.name}:${item.sha}`);

    files.sort();

    return hash(files.join('\n'));
  }

  function showUpdate(version) {
    if (version === dismissedVersion) return;

    pendingVersion = version;
    banner.classList.add('show');
  }

  function hideUpdate() {
    banner.classList.remove('show');
  }

  // Load main.js and remember its actual contents.
  // This prevents comparing against an unrelated
  // server version downloaded after startup.
  async function loadSoundboard() {
    try {
      const source = await fetchFresh('main.js');

      loadedMainVersion = hash(source);

      const blob = new Blob(
        [source],
        { type: 'text/javascript' }
      );

      const scriptURL = URL.createObjectURL(blob);
      const script = document.createElement('script');

      script.src = scriptURL;

      script.onload = () => {
        URL.revokeObjectURL(scriptURL);
      };

      script.onerror = () => {
        URL.revokeObjectURL(scriptURL);
        console.error(
          'The Archives: main.js could not start'
        );
      };

      document.body.appendChild(script);

    } catch (error) {
      console.error(
        'The Archives: unable to load main.js',
        error
      );

      const container = document.getElementById(
        'sounds-container'
      );

      if (container) {
        container.textContent =
          'Could not load sounds. Try refreshing.';
      }
    }
  }

  async function checkForUpdates() {
    if (checking || !navigator.onLine) return;

    checking = true;

    try {
      // Check website code.
      const [html, js] = await Promise.all([
        fetchFresh('index.html'),
        fetchFresh('main.js')
      ]);

      const htmlChanged =
        htmlVersion(html) !== loadedHTMLVersion;

      const jsChanged =
        loadedMainVersion !== null &&
        hash(js) !== loadedMainVersion;

      // Check MP3 changes separately so an API
      // failure doesn't block code update detection.
      let soundsChanged = false;

      try {
        const soundVersion = await getSoundVersion();

        if (initialSoundVersion === null) {
          initialSoundVersion = soundVersion;
        } else {
          soundsChanged =
            soundVersion !== initialSoundVersion;
        }

      } catch (error) {
        console.warn(
          'Sound update check unavailable:',
          error
        );
      }

      if (htmlChanged || jsChanged || soundsChanged) {
        const version = [
          hash(html),
          hash(js),
          initialSoundVersion || ''
        ].join(':');

        // Include a changed sound revision if present.
        const updateKey = version + ':' +
          (soundsChanged ? 'sounds-changed' : '');

        showUpdate(updateKey);
      } else {
        pendingVersion = null;
        hideUpdate();
      }

    } catch (error) {
      console.warn(
        'The Archives update check failed:',
        error
      );

    } finally {
      checking = false;
    }
  }

  updateNow.addEventListener('click', () => {
    updateNow.disabled = true;
    updateNow.textContent = 'Updating...';

    hideUpdate();

    // Reload the latest document.
    const url = new URL(location.href);

    url.searchParams.set(
      '_archives_refresh',
      String(Date.now())
    );

    location.replace(url.href);
  });

  later.addEventListener('click', () => {
    dismissedVersion = pendingVersion;
    hideUpdate();
  });

  // Start the soundboard first.
  loadSoundboard();

  // First check after the page has initialized.
  // The initial directory snapshot becomes the
  // reference for changes made while this tab is open.
  checkForUpdates();

  setInterval(
    checkForUpdates,
    CHECK_INTERVAL
  );

  window.addEventListener(
    'online',
    checkForUpdates
  );

  document.addEventListener(
    'visibilitychange',
    () => {
      if (!document.hidden) {
        checkForUpdates();
      }
    }
  );

})();
</script>

</body>
</html>
